name: Deploy web app

# Builds the Flutter web app and publishes it to GitHub Pages on every push to
# main, so updating the app never needs a particular machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a run finish rather than cancelling it, so a deploy is never half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get

      # The tests are pure Dart and pure Flutter, so they run here without a
      # device. A broken build should not reach the app on anyone's phone.
      - run: flutter analyze
      - run: flutter test

      # The site is served from /pokescan/, not the domain root.
      - run: flutter build web --release --base-href /pokescan/

      # GitHub Pages serves no fallback for unknown paths, which breaks a
      # deep link like /pokescan/#/card/swsh3-20 on a hard refresh. Serving
      # index.html as the 404 page hands routing back to the app.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
