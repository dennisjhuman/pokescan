<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the --base-href argument to `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scan a Pokémon card, see what it is worth, and keep track of your collection.">

  <!-- viewport-fit=cover lets the app use the full screen behind the notch. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#E3350D">

  <!-- Installed-app behaviour on iOS: no Safari chrome once added to the home screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokéScan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PokéScan</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #17120f;
      overscroll-behavior: none;
    }

    /* Shown until Flutter paints its first frame. The bundle is several
       megabytes, so a cold load over mobile data sits here for a moment and a
       blank screen reads as broken. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #17120f;
      color: #f0e7e4;
      font: 500 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; }
    #splash .bar {
      width: 132px;
      height: 3px;
      border-radius: 2px;
      background: #3a2b26;
      overflow: hidden;
    }
    #splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #e3350d;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>PokéScan</div>
    <div class="bar"><span></span></div>
  </div>

  <script>
    // Flutter fires this once it has painted, which is the honest moment to
    // drop the splash.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
